# Chạy toàn bộ hệ thống bằng Docker:   docker compose up --build
#   Du khách:    http://localhost:8080/
#   Admin:       http://localhost:8080/admin/
#   phpMyAdmin:  http://localhost:8081/   (đăng nhập root / mật khẩu MYSQL_ROOT_PASSWORD, mặc định "root")
# Có thể đổi mật khẩu/khóa bằng file .env (xem .env.example).
# Cho người khác truy cập qua Internet (link https tạm thời):  docker compose --profile tunnel up --build -d
#   rồi xem link:  docker compose logs tunnel   (tìm địa chỉ https://....trycloudflare.com)
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: hcmc_audioguide
    ports:
      - "127.0.0.1:3307:3306"   # chỉ máy bạn truy cập được; cổng 3307 để tránh đụng MySQL/XAMPP đang dùng 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db;Port=3306;Database=hcmc_audioguide;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};CharSet=utf8mb4;"
      Jwt__Key: ${JWT_KEY:-change-me-in-production-at-least-32-characters!!}
      Seed__AdminUsername: ${ADMIN_USERNAME:-admin}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin@123}
      Storage__UploadPath: /app/data/uploads
      Hosting__TrustProxy: ${TRUST_PROXY:-true}   # phía trước có Cloudflare Tunnel: lấy IP thật của khách từ X-Forwarded-For
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"   # chỉ mở trên máy bạn, KHÔNG đưa phpMyAdmin ra Internet

  # Tạo link https công khai tới ứng dụng (Cloudflare Quick Tunnel, miễn phí, không cần tài khoản).
  # Chỉ chạy khi dùng:  docker compose --profile tunnel up -d     Link đổi mỗi lần chạy lại.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - api
    command: tunnel --no-autoupdate --url http://api:8080

volumes:
  mysql_data:
  uploads:
