# Render Blueprint: chạy bằng Dockerfile của dự án.
# Render không có MySQL → tạo MySQL/MariaDB bên ngoài (Aiven, TiDB Cloud, Railway...) rồi dán chuỗi kết nối vào ConnectionStrings__Default.
services:
  - type: web
    name: saigon-audio-guide
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__Default
        sync: false            # nhập tay trong Dashboard, ví dụ: Server=...;Port=3306;Database=hcmc_audioguide;User=...;Password=...;CharSet=utf8mb4;SslMode=Required;
      - key: Jwt__Key
        generateValue: true    # Render tự sinh chuỗi ngẫu nhiên đủ dài
      - key: Seed__AdminPassword
        sync: false            # mật khẩu admin ban đầu (đổi lại trong trang Admin sau khi đăng nhập)
      - key: Translation__MyMemoryEmail
        sync: false            # (tùy chọn) email thật của bạn để MyMemory tăng hạn mức dịch tự động mỗi ngày. Có thể để trống.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
