<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c2410c">
  <title>Saigon Audio Guide</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header>
    <div class="brand"><strong>Saigon Audio Guide</strong><small id="tSub"></small></div>
    <label class="langpick">
      <span aria-hidden="true">🌐</span>
      <select id="selLang" aria-label="Language"></select>
    </label>
  </header>

  <main class="stage">
    <div id="map"></div>

    <!-- Bảng bên trái: danh sách + nội dung thuyết minh. Thu gọn bằng nút ◀ để xem toàn bộ bản đồ. -->
    <aside id="panel" class="panel no-anim">
      <button id="btnPanel" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panelBody"></button>
      <div id="panelBody" class="panel-body">
        <div class="toolbar">
          <button id="btnGps" class="primary" type="button"></button>
          <label class="demo"><input type="checkbox" id="chkDemo"><span id="tDemo"></span></label>
        </div>
        <div id="status" role="status" aria-live="polite"></div>

        <section id="player" hidden aria-live="polite">
          <div class="player-info">
            <strong id="plName"></strong>
            <small id="plNote"></small>
            <p id="plText"></p>
          </div>
          <div class="player-actions">
            <button id="btnTap" class="primary" type="button" hidden></button>
            <button id="btnStop" type="button"></button>
          </div>
        </section>

        <ul id="list"></ul>
        <p id="privacy" class="privacy"></p>
      </div>
    </aside>
  </main>

  <div id="overlay" hidden>
    <div class="card">
      <h2 id="wTitle"></h2>
      <p id="wText"></p>
      <button id="btnStart" class="primary big" type="button"></button>
      <p id="wPrivacy" class="privacy"></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
