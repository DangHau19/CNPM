<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saigon Audio Guide</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header>
    <div class="brand"><strong>Saigon Audio Guide</strong><small id="tSub"></small></div>
    <button id="btnLang" class="chip" type="button"></button>
  </header>

  <div id="map"></div>

  <div class="toolbar">
    <button id="btnGps" class="primary" type="button"></button>
    <label class="demo"><input type="checkbox" id="chkDemo"><span id="tDemo"></span></label>
  </div>
  <div id="status" role="status"></div>

  <ul id="list"></ul>

  <div id="player" hidden>
    <div class="player-info">
      <strong id="plName"></strong>
      <small id="plNote"></small>
      <p id="plText"></p>
    </div>
    <button id="btnStop" class="primary" type="button"></button>
  </div>

  <div id="overlay" hidden>
    <div class="card">
      <h2 id="ovTitle">🌐 Choose your language / Chọn ngôn ngữ</h2>
      <div id="ovLangs"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
