<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Guide – Admin</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#667085; --brand:#c2410c; --line:#e4e7ec; --danger:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212b; --text:#e8ecf2; --muted:#98a2b3; --brand:#fb923c; --line:#2b3340; --danger:#f97066; } }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:10px 18px; background:var(--card); border-bottom:1px solid var(--line); }
    nav { display:flex; gap:6px; }
    main { max-width:1100px; margin:18px auto; padding:0 14px; }
    button, input, select, textarea { font:inherit; color:var(--text); }
    button { cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); padding:6px 12px; }
    button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
    button.danger { color:var(--danger); }
    button.active { border-color:var(--brand); color:var(--brand); font-weight:600; }
    input, select, textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
    textarea { min-height:110px; resize:vertical; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:8px 0 3px; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { color:var(--muted); font-size:.8rem; text-transform:uppercase; }
    .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
    .login { max-width:340px; margin:12vh auto; }
    dialog { width:min(760px,96vw); border:1px solid var(--line); border-radius:14px; background:var(--bg); color:var(--text); padding:18px; }
    dialog::backdrop { background:rgba(0,0,0,.55); }
    fieldset { border:1px solid var(--line); border-radius:10px; margin:12px 0; background:var(--card); }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .toast { position:fixed; bottom:16px; right:16px; background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; z-index:99; }
    .toast.err { background:var(--danger); color:#fff; }
    .bar-fill { height:10px; background:var(--brand); border-radius:6px; }
    .muted { color:var(--muted); }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <section id="loginView" class="card login" hidden>
    <h2>Đăng nhập quản trị</h2>
    <label>Tên đăng nhập</label><input id="lgUser" autocomplete="username">
    <label>Mật khẩu</label><input id="lgPass" type="password" autocomplete="current-password">
    <div class="row"><button class="primary" id="btnLogin" type="button">Đăng nhập</button></div>
  </section>

  <div id="appView" hidden>
    <header>
      <strong>🎧 Audio Guide – Admin</strong>
      <nav>
        <button data-tab="places" type="button">Địa điểm</button>
        <button data-tab="languages" type="button">Ngôn ngữ</button>
        <button data-tab="stats" type="button">Thống kê</button>
        <button id="btnLogout" type="button">Đăng xuất</button>
      </nav>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="dlg"></dialog>
  <script src="/admin/admin.js"></script>
</body>
</html>
