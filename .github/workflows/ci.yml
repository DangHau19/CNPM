name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HcmcAudioGuide.slnx
      - run: dotnet build HcmcAudioGuide.slnx -c Release --no-restore
      - run: dotnet test HcmcAudioGuide.slnx -c Release --no-build

  docker-build:
    name: Docker image builds
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hcmc-audioguide .
